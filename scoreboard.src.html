<body class="font-sans antialiased min-h-screen pb-20">

    <div id="root"></div>

    <script type="text/babel">
        // Sound Engine
        const createSoundEngine = () => {
            let audioCtx = null;
            
            const getCtx = () => {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return audioCtx;
            };

            // 効果音の音量 (ピン/ポン/勝利音)。音量を上げても割れにくいようコンプレッサーを通す。
            // ※ アラーム音は音量設定に関係なく一定
            let masterVolume = 1;
            let masterGain = null;
            const getMaster = () => {
                const ctx = getCtx();
                if (!masterGain) {
                    masterGain = ctx.createGain();
                    masterGain.gain.value = masterVolume;
                    const comp = ctx.createDynamicsCompressor();
                    masterGain.connect(comp);
                    comp.connect(ctx.destination);
                }
                return masterGain;
            };
            const setVolume = (v) => {
                masterVolume = Math.max(0, Math.min(2, v));
                if (masterGain) masterGain.gain.value = masterVolume;
            };

            const playPing = (enabled = true) => {
                if (!enabled) return;
                try {
                    const ctx = getCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(850, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(420, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(getMaster());
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } catch (e) {}
            };

            const playPong = (enabled = true) => {
                if (!enabled) return;
                try {
                    const ctx = getCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(540, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(270, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.35, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.connect(gain);
                    gain.connect(getMaster());
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } catch (e) {}
            };

            const playWin = (enabled = true) => {
                if (!enabled) return;
                try {
                    const ctx = getCtx();
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.28);
                        osc.connect(gain);
                        gain.connect(getMaster());
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.28);
                    });
                } catch (e) {}
            };

            // アラーム音: ピピピピッ と4回
            const playAlarm = (enabled = true) => {
                if (!enabled) return;
                try {
                    const ctx = getCtx();
                    for (let i = 0; i < 4; i++) {
                        const t0 = ctx.currentTime + i * 0.22;
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(1320, t0);
                        gain.gain.setValueAtTime(0.0001, t0);
                        gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01);
                        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(t0);

        // ---- リーグ戦・団体戦 ----
        const LEAGUE_TYPES = [['singles', 'シングルス', '個人戦の総当たり'], ['doubles', 'ダブルス', 'ペアの総当たり'], ['team', '団体戦', 'チーム対抗(複数本)']];
        const BOUT_PRESETS = [
            { id: 's5', name: '5本 (S・S・D・S・S)', kinds: ['S', 'S', 'D', 'S', 'S'] },
            { id: 's3', name: '3本 (S・D・S)', kinds: ['S', 'D', 'S'] },
            { id: 'ss3', name: '3本 (S・S・S)', kinds: ['S', 'S', 'S'] }
        ];

        // 総当たりの組み合わせ (サークル方式。各ラウンドで全員が1試合ずつ)
        const generateRoundRobin = (ids) => {
            const list = [...ids];
            if (list.length % 2 === 1) list.push(null);
            const n = list.length;
            const rounds = [];
            for (let r = 0; r < n - 1; r++) {
                const pairs = [];
                for (let i = 0; i < n / 2; i++) {
                    const a = list[i], b = list[n - 1 - i];
                    if (a !== null && b !== null) pairs.push([a, b]);
                }
                rounds.push(pairs);
                list.splice(1, 0, list.pop());
            }
            return rounds;
        };

        const buildFixtures = (lg) => {
            const rounds = generateRoundRobin(lg.entrants.map(e => e.id));
            const fixtures = [];
            rounds.forEach((pairs, ri) => pairs.forEach(([a, b], pi) => {
                const f = { id: `f${ri}_${pi}`, round: ri + 1, aId: a, bId: b, status: 'pending', aGames: 0, bGames: 0, games: [] };
                if (lg.type === 'team') {
                    f.bouts = lg.boutKinds.map(kind => ({ kind, aIds: [], bIds: [], done: false, winner: null, aGames: 0, bGames: 0, games: [] }));
                }
                fixtures.push(f);
            }));
            return fixtures;
        };

        // 1つの対戦(団体戦なら先に過半数の本数を取った側が勝ち)の結果
        const fixtureResult = (lg, f) => {
            if (f.bye) return { done: true, started: true, aScore: 0, bScore: 0, winner: f.aId ? 'a' : 'b', bye: true };
            if (lg.type === 'team') {
                const need = Math.ceil(f.bouts.length / 2);
                let aW = 0, bW = 0, played = 0;
                f.bouts.forEach(b => { if (b.done) { played++; if (b.winner === 'a') aW++; else if (b.winner === 'b') bW++; } });
                const decided = aW >= need || bW >= need;
                return { done: decided, started: played > 0, aScore: aW, bScore: bW, winner: decided ? (aW > bW ? 'a' : 'b') : null, need };
            }
            const done = f.status === 'done';
            return { done, started: done, aScore: f.aGames, bScore: f.bGames, winner: done ? (f.aGames > f.bGames ? 'a' : f.bGames > f.aGames ? 'b' : null) : null };
        };

        // 順位表: 勝ち点 → ゲーム(本数)の得失 → ラリーポイントの得失
        const computeStandings = (lg) => {
            const rows = {};
            lg.entrants.forEach(e => { rows[e.id] = { id: e.id, name: e.name, played: 0, wins: 0, losses: 0, pts: 0, gf: 0, ga: 0, pf: 0, pa: 0 }; });
            lg.fixtures.forEach(f => {
                const r = fixtureResult(lg, f);
                if (!r.done || !r.winner) return;
                const A = rows[f.aId], B = rows[f.bId];
                if (!A || !B) return;
                A.played++; B.played++;
                if (r.winner === 'a') { A.wins++; B.losses++; A.pts += lg.winPts; B.pts += lg.lossPts; }
                else { B.wins++; A.losses++; B.pts += lg.winPts; A.pts += lg.lossPts; }
                A.gf += r.aScore; A.ga += r.bScore; B.gf += r.bScore; B.ga += r.aScore;
                const gl = lg.type === 'team' ? f.bouts.flatMap(b => b.games || []) : (f.games || []);
                gl.forEach(g => { A.pf += g.a; A.pa += g.b; B.pf += g.b; B.pa += g.a; });
            });
            const arr = Object.values(rows);
            arr.sort((x, y) => (y.pts - x.pts) || ((y.gf - y.ga) - (x.gf - x.ga)) || ((y.pf - y.pa) - (x.pf - x.pa)) || x.name.localeCompare(y.name, 'ja'));
            let rank = 0;
            arr.forEach((r, i) => {
                const pv = arr[i - 1];
                if (i === 0 || !(pv.pts === r.pts && (pv.gf - pv.ga) === (r.gf - r.ga) && (pv.pf - pv.pa) === (r.pf - r.pa))) rank = i + 1;
                r.rank = rank;
            });
            return arr;
        };

        const buildStandingsText = (lg) => {
            const rows = computeStandings(lg);
            const total = lg.fixtures.length;
            const done = lg.fixtures.filter(f => fixtureResult(lg, f).done).length;
            const unit = lg.type === 'team' ? '本' : 'G';
            const lines = [`🏆 ${lg.name}  (${done}/${total}試合)`];
            rows.forEach(r => {
                const d = r.gf - r.ga;
                lines.push(`${r.rank}位 ${r.name}  ${r.wins}勝${r.losses}敗  ${r.pts}pt  (${unit}${d > 0 ? '+' : ''}${d})`);
            });
            return lines.join('\n');
        };

        // ---- トーナメント(勝ち抜き戦) ----
        const nextPow2 = (n) => { let s = 1; while (s < n) s *= 2; return s; };

        // 標準的なトーナメントの並び方(シード番号)。8枠なら [1,8,4,5,2,7,3,6]。
        // 1番シードと2番シードは決勝まで当たらず、強いシードほど早い回で弱い相手(またはBYE)と当たる
        const seedSlots = (size) => {
            let arr = [1];
            while (arr.length < size) { const m = arr.length * 2 + 1; arr = arr.flatMap(x => [x, m - x]); }
            return arr;
        };

        // 乱数の種を指定できるシャッフル (同じ種なら同じ結果 → プレビューと作成結果が一致する)
        const seededShuffle = (arr, seed) => {
            const a = [...arr];
            let t = (seed >>> 0) || 1;
            const rnd = () => {
                t += 0x6D2B79F5;
                let x = t;
                x = Math.imul(x ^ (x >>> 15), x | 1);
                x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
                return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
            };
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(rnd() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        };

        // シード指定(参加者ID → シード番号)と抽選の種から、シード順(1番〜)の参加者ID配列を作る。
        // シードの人は番号順に先頭へ、シードでない人は抽選(ランダム)で続く
        const tournamentOrder = (entrantIds, seedMap, drawSeed) => {
            const m = seedMap || {};
            const seeded = entrantIds.filter(id => m[id]).sort((x, y) => m[x] - m[y]);
            const rest = seededShuffle(entrantIds.filter(id => !m[id]), drawSeed);
            return [...seeded, ...rest];
        };

        const roundLabel = (R, r) => (r === R ? '決勝' : r === R - 1 ? '準決勝' : r === R - 2 ? '準々決勝' : `${r}回戦`);

        // 各対戦の参加者を、「どこから来るか」(src)から決め直す。
        //  src: {t:'e',id}=参加者 / {t:'bye'}=不戦 / {t:'w',f}=対戦fの勝者 / {t:'l',f}=対戦fの敗者
        // 前の回の結果を直したときは、参加者が変わった対戦の結果を自動でリセットする
        const resolveTournament = (lg, fixtures) => {
            const fx = fixtures.map(f => ({ ...f }));
            const byId = {};
            fx.forEach(f => { byId[f.id] = f; });
            const blankBouts = () => (lg.type === 'team'
                ? (lg.boutKinds || []).map(kind => ({ kind, aIds: [], bIds: [], done: false, winner: null, aGames: 0, bGames: 0, games: [] }))
                : undefined);
            const winnerOf = (f) => {
                if (!f) return null;
                if (f.bye) return f.aId || f.bId;
                const r = fixtureResult(lg, f);
                return r.done && r.winner ? (r.winner === 'a' ? f.aId : f.bId) : null;
            };
            const loserOf = (f) => {
                if (!f || f.bye) return null;
                const r = fixtureResult(lg, f);
                return r.done && r.winner ? (r.winner === 'a' ? f.bId : f.aId) : null;
            };
            const val = (src) => (src.t === 'e' ? src.id : src.t === 'bye' ? null : src.t === 'w' ? winnerOf(byId[src.f]) : loserOf(byId[src.f]));
            const order = [...fx].sort((x, y) => (x.third ? 1 : 0) - (y.third ? 1 : 0) || x.round - y.round || x.idx - y.idx);
            order.forEach(f => {
                const a = val(f.srcA), b = val(f.srcB);
                const changed = a !== f.aId || b !== f.bId;
                f.aId = a; f.bId = b;
                f.bye = f.srcA.t === 'bye' || f.srcB.t === 'bye';
                if (f.bye) { f.status = 'done'; return; }
                if (changed && (f.status === 'done' || (f.bouts && f.bouts.some(x => x.done)))) {
                    f.status = 'pending'; f.aGames = 0; f.bGames = 0; f.games = [];
                    const bb = blankBouts();
                    if (bb) f.bouts = bb;
                }
            });
            return fx;
        };

        // トーナメント表を作る。参加者数が2のべき乗でないときは、上位シードがBYE(不戦勝)で2回戦へ進む
        const buildTournamentFixtures = (lg) => {
            const ids = lg.entrants.map(e => e.id);
            const n = ids.length;
            const size = nextPow2(Math.max(2, n));
            const R = Math.round(Math.log2(size));
            const order = tournamentOrder(ids, lg.seedMap || {}, lg.drawSeed || 1);
            const slots = seedSlots(size);
            const entAt = (seedNo) => (seedNo <= n ? order[seedNo - 1] : null);
            const mkBouts = () => (lg.type === 'team'
                ? (lg.boutKinds || []).map(kind => ({ kind, aIds: [], bIds: [], done: false, winner: null, aGames: 0, bGames: 0, games: [] }))
                : undefined);
            const base = (id, round, idx, srcA, srcB, extra = {}) => {
                const f = { id, round, idx, srcA, srcB, aId: null, bId: null, status: 'pending', aGames: 0, bGames: 0, games: [], bye: false, ...extra };
                const b = mkBouts();
                if (b) f.bouts = b;
                return f;
            };
            const src = (id) => (id ? { t: 'e', id } : { t: 'bye' });
            const fixtures = [];
            for (let i = 0; i < size / 2; i++) {
                fixtures.push(base(`t1_${i}`, 1, i, src(entAt(slots[i * 2])), src(entAt(slots[i * 2 + 1]))));
            }
            for (let r = 2; r <= R; r++) {
                for (let i = 0; i < size / Math.pow(2, r); i++) {
                    fixtures.push(base(`t${r}_${i}`, r, i, { t: 'w', f: `t${r - 1}_${i * 2}` }, { t: 'w', f: `t${r - 1}_${i * 2 + 1}` }));
                }
            }
            if (lg.thirdPlace && R >= 2) {
                fixtures.push(base('t3rd', R, 99, { t: 'l', f: `t${R - 1}_0` }, { t: 'l', f: `t${R - 1}_1` }, { third: true }));
            }
            return resolveTournament(lg, fixtures);
        };

        const tournamentFinal = (lg) => {
            const fx = lg.fixtures.filter(f => !f.third);
            if (!fx.length) return null;
            const R = Math.max(...fx.map(f => f.round));
            return fx.find(f => f.round === R) || null;
        };
        // 優勝・準優勝・3位 (決勝が終わっていなければ null)
        const tournamentPlacings = (lg) => {
            const final = tournamentFinal(lg);
            if (!final) return null;
            const r = fixtureResult(lg, final);
            if (!r.done || !r.winner) return null;
            const champ = r.winner === 'a' ? final.aId : final.bId;
            const runner = r.winner === 'a' ? final.bId : final.aId;
            let third = null;
            const t = lg.fixtures.find(f => f.third);
            if (t) {
                const tr = fixtureResult(lg, t);
                if (tr.done && tr.winner) third = tr.winner === 'a' ? t.aId : t.bId;
            }
            return { champ, runner, third };
        };

        const buildTournamentText = (lg) => {
            const nm = (id) => (lg.entrants.find(e => e.id === id) || {}).name || '未定';
            const fx = lg.fixtures.filter(f => !f.third);
            const R = Math.max(...fx.map(f => f.round));
            const line = (f) => {
                const res = fixtureResult(lg, f);
                return res.done ? `${nm(f.aId)} ${res.aScore}-${res.bScore} ${nm(f.bId)}` : `${nm(f.aId)} vs ${nm(f.bId)}`;
            };
            const lines = [`🏆 ${lg.name} (トーナメント)`];
            const pl = tournamentPlacings(lg);
            if (pl) {
                lines.push(`優勝: ${nm(pl.champ)}`, `準優勝: ${nm(pl.runner)}`);
                if (pl.third) lines.push(`3位: ${nm(pl.third)}`);
            }
            for (let r = 1; r <= R; r++) {
                const list = fx.filter(f => f.round === r && !f.bye).sort((a, b) => a.idx - b.idx);
                if (!list.length) continue;
                lines.push('', `■ ${roundLabel(R, r)}`);
                list.forEach(f => lines.push(line(f)));
            }
            const t = lg.fixtures.find(f => f.third);
            if (t) lines.push('', '■ 3位決定戦', line(t));
            return lines.join('\n');
        };

        // ---- 結果の共有 / 試合の分析 ----
        const buildResultText = (item) => {
            const finished = item.status === 'completed';
            const games = (item.gameLogs || []).map(g => `${g.p1}-${g.p2}`).join(', ');
            const lines = [
                `🏓 ${item.date || ''}${item.matchMode === 'doubles' ? ' (ダブルス)' : ''}`.trim(),
                `${item.p1Name}  ${item.p1Games} - ${item.p2Games}  ${item.p2Name}`
            ];
            if (games) lines.push(`(${games})`);
            if (finished && item.winnerName) lines.push(`勝者: ${item.winnerName}`);
            else if (!finished) lines.push('※ 試合の途中経過です');
            if (item.leagueName) lines.push(`🏆 ${item.leagueName}`);
            return lines.join('\n');
        };

        const copyTextToClipboard = async (text) => {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; }
            } catch (e) {}
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (e) { return false; }
        };

        const loadImageEl = (src) => new Promise((resolve, reject) => {
            const img = new Image();
            const timer = setTimeout(() => reject(new Error('image load timeout')), 3000);   // 保険: 読み込めなくても画像生成は続ける
            img.onload = () => { clearTimeout(timer); resolve(img); };
            img.onerror = (e) => { clearTimeout(timer); reject(e); };
            img.src = src;
        });

        // 結果カード画像 (1080x1080 PNG) を作る
        const makeResultImageBlob = async (item, logoSrc) => {
            const W = 1080, H = 1080;
            const c = document.createElement('canvas');
            c.width = W; c.height = H;
            const g = c.getContext('2d');
            if (!g) throw new Error('canvas unsupported');
            const FONT = '"Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif';

            const bg = g.createLinearGradient(0, 0, W, H);
            bg.addColorStop(0, '#0a5fe0');
            bg.addColorStop(1, '#4fb6ff');
            g.fillStyle = bg;
            g.fillRect(0, 0, W, H);
            // やわらかい光
            const glow = g.createRadialGradient(W * 0.85, H * 0.1, 10, W * 0.85, H * 0.1, 520);
            glow.addColorStop(0, 'rgba(255,255,255,0.28)');
            glow.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = glow;
            g.fillRect(0, 0, W, H);

            // 文字を枠に収める
            const fitText = (text, maxW, startSize, weight = 'bold') => {
                let size = startSize;
                g.font = `${weight} ${size}px ${FONT}`;
                while (g.measureText(text).width > maxW && size > 22) {
                    size -= 2;
                    g.font = `${weight} ${size}px ${FONT}`;
                }
                return size;
            };
            const pill = (x, y, w, h, r, fill) => {
                g.beginPath();
                g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
                g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
                g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
                g.closePath();
                g.fillStyle = fill;
                g.fill();
            };

            // ロゴ
            try {
                const logo = await loadImageEl(logoSrc);
                const lh = 96;
                const lw = lh * (logo.width / logo.height);
                g.drawImage(logo, 64, 56, lw, lh);
            } catch (e) {}

            g.textBaseline = 'alphabetic';
            g.fillStyle = 'rgba(255,255,255,0.9)';
            g.font = `600 34px ${FONT}`;
            g.textAlign = 'right';
            g.fillText(`${item.date || ''}${item.matchMode === 'doubles' ? '  ダブルス' : ''}`, W - 64, 110);

            const finished = item.status === 'completed';
            g.textAlign = 'center';
            g.fillStyle = 'rgba(255,255,255,0.85)';
            g.font = `600 36px ${FONT}`;
            g.fillText(item.leagueName ? item.leagueName : (finished ? '試合結果' : '試合の途中経過'), W / 2, 250);

            // 選手名
            const win1 = finished && item.winnerSide === 'p1';
            const win2 = finished && item.winnerSide === 'p2';
            const colX = [W * 0.27, W * 0.73];
            [[item.p1Name, win1], [item.p2Name, win2]].forEach(([name, isWin], i) => {
                const size = fitText(name || '', 440, 56);
                g.fillStyle = isWin ? '#ffffff' : 'rgba(255,255,255,0.78)';
                g.font = `bold ${size}px ${FONT}`;
                g.textAlign = 'center';
                g.fillText(name || '', colX[i], 360);
            });

            // ゲームカウント
            g.font = `800 300px ${FONT}`;
            g.textAlign = 'center';
            g.fillStyle = win1 ? '#ffffff' : 'rgba(255,255,255,0.65)';
            g.fillText(String(item.p1Games ?? 0), colX[0], 640);
            g.fillStyle = win2 ? '#ffffff' : 'rgba(255,255,255,0.65)';
            g.fillText(String(item.p2Games ?? 0), colX[1], 640);
            g.fillStyle = 'rgba(255,255,255,0.7)';
            g.font = `700 120px ${FONT}`;
            g.fillText('-', W / 2, 600);

            // 各ゲームのスコア
            const logs = item.gameLogs || [];
            if (logs.length) {
                const labels = logs.map((l, i) => `G${i + 1}  ${l.p1} - ${l.p2}`);
                g.font = `bold 34px ${FONT}`;
                const widths = labels.map(t => g.measureText(t).width + 44);
                const gap = 16;
                // 幅に収まらない場合は2段に分ける
                const rows = [];
                let cur = [], curW = 0;
                labels.forEach((t, i) => {
                    if (curW + widths[i] + (cur.length ? gap : 0) > W - 140 && cur.length) { rows.push(cur); cur = []; curW = 0; }
                    cur.push(i); curW += widths[i] + (cur.length > 1 ? gap : 0);
                });
                if (cur.length) rows.push(cur);
                rows.forEach((row, ri) => {
                    const total = row.reduce((a, i) => a + widths[i], 0) + gap * (row.length - 1);
                    let x = (W - total) / 2;
                    const y = 730 + ri * 66;
                    row.forEach(i => {
                        pill(x, y, widths[i], 52, 26, 'rgba(255,255,255,0.22)');
                        g.fillStyle = '#ffffff';
                        g.font = `bold 34px ${FONT}`;
                        g.textAlign = 'center';
                        g.fillText(labels[i], x + widths[i] / 2, y + 37);
                        x += widths[i] + gap;
                    });
                });
            }

            // 勝者
            if (finished && item.winnerName) {
                const t = `勝者  ${item.winnerName}`;
                const size = fitText(t, W - 200, 54);
                g.fillStyle = '#ffffff';
                g.font = `bold ${size}px ${FONT}`;
                g.textAlign = 'center';
                g.fillText(t, W / 2, 950);
            }
            g.fillStyle = 'rgba(255,255,255,0.7)';
            g.font = `600 28px ${FONT}`;
            g.textAlign = 'center';
            g.fillText('Scoreboard PRO', W / 2, 1030);

            return await new Promise((resolve, reject) => c.toBlob(b => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/png'));
        };

        // 1点ごとの記録から、試合の分析データを作る
        const analyzeMatch = (item) => {
            const log = item.pointLog || [];
            if (!log.length) return null;
            const gameCount = Math.max(...log.map(e => e[0])) + 1;
            const games = [];
            for (let gi = 0; gi < gameCount; gi++) {
                const ent = log.filter(e => e[0] === gi);
                if (!ent.length) { games.push(null); continue; }
                games.push({ entries: ent, stats: summarizeEntries(ent) });
            }
            return { games, all: summarizeEntries(log), log };
        };
        const summarizeEntries = (ent) => {
            const side = () => ({ points: 0, servePlayed: 0, serveWon: 0, recvPlayed: 0, recvWon: 0, maxRun: 0, maxLead: 0 });
            const sides = { 1: side(), 2: side() };
            let lastW = 0, run = 0, lastG = -1;
            ent.forEach(e => {
                const [g, w, a, b, sv] = e;
                if (g !== lastG) { run = 0; lastW = 0; lastG = g; }
                run = (w === lastW) ? run + 1 : 1;
                lastW = w;
                sides[w].points++;
                sides[w].maxRun = Math.max(sides[w].maxRun, run);
                [1, 2].forEach(sd => {
                    if (sv === sd) { sides[sd].servePlayed++; if (w === sd) sides[sd].serveWon++; }
                    else { sides[sd].recvPlayed++; if (w === sd) sides[sd].recvWon++; }
                });
                sides[1].maxLead = Math.max(sides[1].maxLead, a - b);
                sides[2].maxLead = Math.max(sides[2].maxLead, b - a);
            });
            return { 1: sides[1], 2: sides[2], count: ent.length };
        };

        // 得点差の推移グラフ (上=A側がリード / 下=B側がリード)
        const PointChart = ({ entries, isLight, showGameBreaks }) => {
            const W = 320, H = 160, padL = 28, padR = 8, padT = 12, padB = 20;
            const n = entries.length;
            if (!n) return null;
            const diffs = entries.map(e => e[2] - e[3]);
            const maxAbs = Math.max(3, ...diffs.map(Math.abs));
            const xAt = (i) => padL + (i + 1) * ((W - padL - padR) / n);
            const x0 = padL;
            const yMid = padT + (H - padT - padB) / 2;
            const yAt = (d) => yMid - (d / maxAbs) * ((H - padT - padB) / 2);
            // ゲームごとに線を分ける
            const segs = [];
            let cur = null;
            entries.forEach((e, i) => {
                if (!cur || cur.g !== e[0]) { cur = { g: e[0], pts: [[i === 0 ? x0 : xAt(i - 1), yMid]] }; segs.push(cur); }
                cur.pts.push([xAt(i), yAt(e[2] - e[3])]);
            });
            const grid = isLight ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.18)';
            const txt = isLight ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.6)';
            return (
                <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label="得点差の推移グラフ">
                    <defs>
                        <clipPath id="pc-up"><rect x="0" y="0" width={W} height={yMid} /></clipPath>
                        <clipPath id="pc-down"><rect x="0" y={yMid} width={W} height={H - yMid} /></clipPath>
                    </defs>
                    <line x1={padL} y1={yMid} x2={W - padR} y2={yMid} stroke={grid} strokeWidth="1" />
                    <line x1={padL} y1={padT} x2={W - padR} y2={padT} stroke={grid} strokeWidth="0.5" strokeDasharray="3 3" />
                    <line x1={padL} y1={H - padB} x2={W - padR} y2={H - padB} stroke={grid} strokeWidth="0.5" strokeDasharray="3 3" />
                    <text x={padL - 4} y={padT + 3} textAnchor="end" fontSize="9" fill={txt}>+{maxAbs}</text>
                    <text x={padL - 4} y={yMid + 3} textAnchor="end" fontSize="9" fill={txt}>0</text>
                    <text x={padL - 4} y={H - padB + 3} textAnchor="end" fontSize="9" fill={txt}>-{maxAbs}</text>
                    {showGameBreaks && segs.slice(1).map((sg, i) => (
                        <g key={i}>
                            <line x1={sg.pts[0][0]} y1={padT} x2={sg.pts[0][0]} y2={H - padB} stroke={grid} strokeWidth="1" strokeDasharray="2 3" />
                            <text x={sg.pts[0][0] + 3} y={padT + 8} fontSize="9" fill={txt}>G{sg.g + 1}</text>
                        </g>
                    ))}
                    {showGameBreaks && segs[0] && <text x={segs[0].pts[0][0] + 3} y={padT + 8} fontSize="9" fill={txt}>G{segs[0].g + 1}</text>}
                    {segs.map((sg, i) => {
                        const line = sg.pts.map(pt => pt.join(',')).join(' ');
                        const area = `${sg.pts[0][0]},${yMid} ${line} ${sg.pts[sg.pts.length - 1][0]},${yMid}`;
                        return (
                            <g key={i}>
                                <polygon points={area} fill="#0a84ff" fillOpacity="0.28" clipPath="url(#pc-up)" />
                                <polygon points={area} fill="#ff9f0a" fillOpacity="0.28" clipPath="url(#pc-down)" />
                                <polyline points={line} fill="none" stroke={isLight ? '#1c1c1e' : '#f5f5f7'} strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round" />
                            </g>
                        );
                    })}
                </svg>
            );
        };

        // ---- 時計・アラーム ----
        const POSITIONS = [
            ['top-left', '左上'], ['top-center', '上中央'], ['top-right', '右上'],
            ['bottom-left', '左下'], ['bottom-center', '下中央'], ['bottom-right', '右下']
        ];

        const pad2 = (n) => String(n).padStart(2, '0');

        // 指定時刻(HH:MM)の「次の」発生時刻(ms)。今より後の直近を返す
        const computeNextAlarm = (hhmm, from = Date.now()) => {
            const [h, m] = (hhmm || '00:00').split(':').map(n => parseInt(n, 10) || 0);
            const d = new Date(from);
            d.setHours(h, m, 0, 0);
            if (d.getTime() <= from) d.setDate(d.getDate() + 1);
            return d.getTime();
        };

        // 1秒ごとに更新される現在時刻。時計ウィジェットだけが再描画されるよう各自で持つ
        const useNow = (active = true, interval = 1000) => {
            const [now, setNow] = React.useState(() => Date.now());
            React.useEffect(() => {
                if (!active) return;
                setNow(Date.now());
                const id = setInterval(() => setNow(Date.now()), interval);
                return () => clearInterval(id);
            }, [active, interval]);
            return now;
        };

        const ClockWidget = ({ seconds, size }) => {
            const now = useNow(true);
            const d = new Date(now);
            const sizeClass = size === 'small' ? 'text-sm' : size === 'large' ? 'text-3xl' : 'text-xl';
            return (
                <div className={`glass-card rounded-2xl px-3 py-1.5 font-mono font-bold tabular-nums leading-none whitespace-nowrap ${sizeClass}`} title="現在時刻">
                    {pad2(d.getHours())}:{pad2(d.getMinutes())}
                    {seconds && <span className="text-apple-subtext font-semibold" style={{ fontSize: '0.65em' }}>:{pad2(d.getSeconds())}</span>}
                </div>
            );
        };

        const AlarmWidget = ({ time, nextAt, showRemaining }) => {
            const now = useNow(!!nextAt);
            const remain = nextAt ? Math.max(0, Math.floor((nextAt - now) / 1000)) : null;
            const h = remain !== null ? Math.floor(remain / 3600) : 0;

        // カウントダウンタイマー: 状態は親(App)が持ち、ここは表示と操作ボタンだけ

        // Number to English word helper
        const getEnglishNumberWord = (num) => {

                           'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen', 'Twenty'];
            return words[num] || num.toString();
        };

        // Speech Synthesis Helper
        // 数字ごとに発話を分け、間(ま)をミリ秒で指定できるようにする。
        // (1回の発話にまとめると間を調整できず、「One All」も詰まって聞こえるため)
        let speechToken = 0;

        const speechOptsFrom = (st) => ({
            rate: typeof st.speechRate === 'number' ? st.speechRate : 1.0,
            volume: typeof st.speechVolume === 'number' ? st.speechVolume / 100 : 1,
            pairGapMs: typeof st.speechPairGap === 'number' ? st.speechPairGap : 350,
            allGapMs: typeof st.speechAllGap === 'number' ? st.speechAllGap : 250
        });

        // parts: [{ text, gapAfter(ms) }]  を順番に読み上げる
        const speakParts = (parts, lang, opts) => {
            const myToken = ++speechToken;      // 新しい読み上げが始まったら古い予約は無効
            window.speechSynthesis.cancel();
            const speakAt = (i) => {
                if (myToken !== speechToken || i >= parts.length) return;
                const u = new SpeechSynthesisUtterance(parts[i].text);
                u.lang = lang;
                u.rate = opts.rate;
                u.volume = opts.volume;
                let advanced = false;
                const next = () => {
                    if (advanced) return;
                    advanced = true;
                    if (i + 1 < parts.length) setTimeout(() => speakAt(i + 1), Math.max(0, parts[i].gapAfter));
                };
                u.onend = next;
                u.onerror = next;
                setTimeout(next, 5000);          // 端末によって onend が来ない場合の保険
                window.speechSynthesis.speak(u);
            };
            speakAt(0);
        };

        // serverScore = 今サーブ権を持つ側の点数(先に読む), receiverScore = レシーバー側の点数

            if (!enabled || !('speechSynthesis' in window)) return;
            const o = { rate: 1.0, volume: 1, pairGapMs: 350, allGapMs: 250, ...opts };
            try {
                let parts = [];
                let lang = 'en-US';

                if (langMode === 'en') {
                    if (serverScore === receiverScore) {
                        const first = serverScore === 0 ? 'Love' : getEnglishNumberWord(serverScore);
                        parts = [{ text: first, gapAfter: o.allGapMs }, { text: 'All', gapAfter: 0 }];
                    } else {
                        parts = [
                            { text: getEnglishNumberWord(serverScore), gapAfter: o.pairGapMs },
                            { text: getEnglishNumberWord(receiverScore), gapAfter: 0 }
                        ];
                    }
                } else {
                    lang = 'ja-JP';
                    parts = [
                        { text: `${serverScore} 対`, gapAfter: o.pairGapMs },
                        { text: `${receiverScore}`, gapAfter: 0 }
                    ];
                }

                // 間を 0 にした場合は、途切れない1回の発話として自然に読む
                if (parts[0].gapAfter <= 0) {

        const getServeSlot = (p1Score, p2Score, pointsToWin = 11, serveInterval = 2) => {
            const total = p1Score + p2Score;
            const deuceThreshold = pointsToWin - 1;
            const interval = Math.max(1, serveInterval);
            if (p1Score >= deuceThreshold && p2Score >= deuceThreshold) {
                const before = deuceThreshold * 2;
                return Math.floor(before / interval) + (total - before);

            return Math.floor(total / interval);
        };

        const buildDoublesOrder = (firstPairIds, otherPairIds, firstServerId, firstReceiverId) => {
            const A = firstPairIds.includes(firstServerId) ? firstServerId : firstPairIds[0];
            const B = firstPairIds.find(id => id !== A);
            const X = otherPairIds.includes(firstReceiverId) ? firstReceiverId : otherPairIds[0];
            const Y = otherPairIds.find(id => id !== X);
            return [A, X, B, Y];
        };

        // 次のゲーム: 最初のサーバーを選ぶと、レシーバーは「前のゲームでその選手にサーブした選手」
        const nextGameDoublesOrder = (prevOrder, newServerId) => {
            let idx = prevOrder.indexOf(newServerId);
            if (idx < 0) idx = 1;
            return [prevOrder[idx], prevOrder[(idx + 3) % 4], prevOrder[(idx + 2) % 4], prevOrder[(idx + 1) % 4]];

        const setupDoublesOrder = (ms) => {

            const deuceThreshold = pointsToWin - 1;
            const validServeInterval = Math.max(1, serveInterval);

            let isSwapped = false;

            if (p1Score >= deuceThreshold && p2Score >= deuceThreshold) {
                const pointsBeforeDeuce = deuceThreshold * 2;
                const servesBeforeDeuce = Math.floor(pointsBeforeDeuce / validServeInterval);
                const deucePoints = totalPoints - pointsBeforeDeuce;
                isSwapped = (servesBeforeDeuce + deucePoints) % 2 !== 0;
            } else {
                const servesCompleted = Math.floor(totalPoints / validServeInterval);
                isSwapped = servesCompleted % 2 !== 0;

            const [modalConfig, setModalConfig] = React.useState({

            const isLight = settings.theme === 'light';

            // Sync theme class
            React.useEffect(() => {

            }, [isLight]);

            // Wake Lock (Screen keep active) - タブ復帰時にも再取得する
            React.useEffect(() => {
                let wakeLock = null;
                let cancelled = false;
                const shouldLock = settings.keepScreenOn && 'wakeLock' in navigator && activeTab === 'match' && !matchState.isFinished;

                const requestWakeLock = async () => {
                    if (!shouldLock || document.visibilityState !== 'visible') return;
                    try {
                        const lock = await navigator.wakeLock.request('screen');
                        if (cancelled) { lock.release().catch(() => {}); return; }
                        wakeLock = lock;
                    } catch (err) {}
                };
                const onVisibility = () => {
                    if (document.visibilityState === 'visible' && (!wakeLock || wakeLock.released)) requestWakeLock();
                };

                requestWakeLock();
                document.addEventListener('visibilitychange', onVisibility);
                return () => {
                    cancelled = true;
                    document.removeEventListener('visibilitychange', onVisibility);
                    if (wakeLock) wakeLock.release().catch(() => {});
                };
            }, [activeTab, settings.keepScreenOn, matchState.isFinished]);

            // Keyboard / Bluetooth Remote Control Support
            React.useEffect(() => {
                const handleKeyDown = (e) => {
                    // モーダル表示中・タイマー中・一時停止中・終了後は無効
                    if (activeTab !== 'match' || matchState.isPaused || matchState.isFinished || timerActive || timeoutPickerOpen || alarmRinging || keyCapture || doublesModalOpen || modalConfig.isOpen) return;
                    // 押しっぱなしの連続加点・ブラウザのショートカット(Ctrl/Cmd+D等)を除外
                    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
                    const tag = e.target && e.target.tagName;
                    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

                    const leftKey = matchState.swappedCourt ? 'p2' : 'p1';
                    const rightKey = matchState.swappedCourt ? 'p1' : 'p2';

                    // 設定の「キー・リモコン」で割り当てたキーに従う
                    const km = getKeyMap(settings);
                    const nk = normKey(e.key);
                    const hit = (action) => (km[action] || []).includes(nk);

                    if (hit('leftPoint')) {
                        e.preventDefault();
                        addPoint(leftKey);
                    } else if (hit('rightPoint')) {
                        e.preventDefault();
                        addPoint(rightKey);
                    } else if (hit('undo')) {
                        e.preventDefault();
                        undoPoint();
                    } else if (hit('timeout')) {
                        e.preventDefault();
                        if ((settings.timeoutsPerSide || 0) > 0) setTimeoutPickerOpen(true);
                    } else if (hit('swapCourt')) {
                        e.preventDefault();
                        swapCourtsManual();
                    } else if (hit('pause')) {
                        e.preventDefault();
                        setMatchState(prev => ({ ...prev, isPaused: true }));
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [activeTab, matchState, settings, players, currentMatchId, timerActive, timeoutPickerOpen, alarmRinging, keyCapture, doublesModalOpen, modalConfig.isOpen]);

            // キー割り当て: 次に押したキーを登録する (他のアクションに同じキーがあれば外す)
            React.useEffect(() => {
                if (!keyCapture) return;
                const onKey = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (e.key === 'Escape') { setKeyCapture(null); return; }
                    if (['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return;
                    const nk = normKey(e.key);
                    setSettings(prev => {
                        const km = { ...getKeyMap(prev) };
                        Object.keys(km).forEach(a => { km[a] = (km[a] || []).filter(k => k !== nk); });
                        km[keyCapture] = [...(km[keyCapture] || []), nk];
                        return { ...prev, keyMap: km };
                    });
                    setKeyCapture(null);
                };
                window.addEventListener('keydown', onKey, true);
                return () => window.removeEventListener('keydown', onKey, true);
            }, [keyCapture]);

            // キーテスト: 設定の「キー・リモコン」を開いている間、押したキーを表示する
            React.useEffect(() => {
                if (activeTab !== 'settings' || settingsSection !== 'keys') return;
                const onKey = (e) => setLastKey({ key: e.key, code: e.code });
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [activeTab, settingsSection]);

            // タイムアウトのカウントダウン: 終了時刻との差から計算するので、画面オフ/バックグラウンドでもずれない
            React.useEffect(() => {
                if (!timeoutInfo) return;
                const tick = () => setTimerTime(Math.max(0, Math.ceil((timeoutInfo.endsAt - Date.now()) / 1000)));
                tick();
                const id = setInterval(tick, 250);
                return () => clearInterval(id);
            }, [timeoutInfo]);

            // 残り10秒の予告音と、終了時の音・バイブ
            React.useEffect(() => {
                if (!timeoutInfo) return;
                const running = Date.now() < timeoutInfo.endsAt;
                if (running && timerTime === 10 && timeoutInfo.totalSec > 10) {
                    soundEngine.playPong(settings.soundEnabled);
                } else if (!running && timerTime === 0) {
                    soundEngine.playWin(settings.soundEnabled);
                    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
                }
            }, [timerTime]);

            // コートチェンジ等の一時通知
            React.useEffect(() => {
                if (!toast) return;
                const id = setTimeout(() => setToast(null), 2500);
                return () => clearTimeout(id);
            }, [toast]);

            // ---- リーグ戦: 試合が終わったら結果を自動で記録 (最後の1点をUndoしたときは undoPoint 側で記録を取り消す) ----
            React.useEffect(() => {
                const ms = matchState;
                if (ms.isFinished && ms.leagueLink && !ms.leagueRecorded) {
                    const link = ms.leagueLink;
                    const dbl = settings.matchMode === 'doubles';
                    recordLeagueResult(link.leagueId, link.fixtureId, link.boutIdx, {
                        aGames: ms.p1Games, bGames: ms.p2Games,
                        games: (ms.gameLogs || []).map(g => ({ a: g.p1, b: g.p2 })),
                        matchId: currentMatchId,
                        aIds: dbl ? [ms.p1Id, ms.p1PartnerId] : [ms.p1Id],
                        bIds: dbl ? [ms.p2Id, ms.p2PartnerId] : [ms.p2Id]
                    });
                    setMatchState(prev => ({ ...prev, leagueRecorded: true }));
                    setToast({ msg: '🏆 リーグ戦に結果を記録しました', id: Date.now() });
                }
            }, [matchState.isFinished, matchState.leagueRecorded]);

            // ---- アラーム ----
            // 設定(オン/時刻)が変わったら、次に鳴る時刻を計算し直す
            React.useEffect(() => {
                setAlarmNextAt(settings.alarmEnabled ? computeNextAlarm(settings.alarmTime) : null);
            }, [settings.alarmEnabled, settings.alarmTime]);

            // 予告(N分前)の通知と、時刻になったときの鳴動開始
            React.useEffect(() => {
                if (!settings.alarmEnabled || !alarmNextAt) return;
                const check = () => {
                    const nowMs = Date.now();
                    const pre = (settings.alarmPreMinutes || 0) * 60000;
                    if (pre > 0 && nowMs >= alarmNextAt - pre && nowMs < alarmNextAt && preNoticeRef.current !== alarmNextAt) {
                        preNoticeRef.current = alarmNextAt;
                        setToast({ msg: `⏰ アラームまで あと${settings.alarmPreMinutes}分`, id: nowMs });
                        soundEngine.playPong(true);
                    }
                    if (nowMs >= alarmNextAt) setAlarmRinging(prev => prev || 'real');
                };
                check();
                const id = setInterval(check, 1000);
                return () => clearInterval(id);
            }, [settings.alarmEnabled, settings.alarmPreMinutes, alarmNextAt]);

            // 鳴動中は音とバイブをくり返す
            React.useEffect(() => {
                if (!alarmRinging) return;
                const ring = () => {
                    if (settings.alarmSound) soundEngine.playAlarm(true);
                    try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
                };
                ring();
                const id = setInterval(ring, 1800);
                return () => clearInterval(id);
            }, [alarmRinging, settings.alarmSound]);

            // ---- カウントダウンタイマー ----
            // 終了判定: 終了時刻との比較なので、バックグラウンドでもずれない
            React.useEffect(() => {
                if (cd.status !== 'running') return;
                const check = () => {
                    if (Date.now() >= cd.endsAt) setCd({ status: 'finished', endsAt: 0, remainingMs: 0 });
                };
                check();
                const id = setInterval(check, 250);
                return () => clearInterval(id);
            }, [cd.status, cd.endsAt]);

            // 終了時: 音とバイブを3回(約5秒)。画面は操作を止めずに点滅表示だけ残す
            React.useEffect(() => {
                if (cd.status !== 'finished') return;
                let count = 0;
                let id = null;
                const ring = () => {
                    if (settings.countdownSound) soundEngine.playAlarm(true);
                    try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
                    count += 1;
                    if (count >= 3 && id) clearInterval(id);
                };
                setToast({ msg: '⏳ タイマー終了', id: Date.now() });
                ring();
                id = setInterval(ring, 1800);
                return () => { if (id) clearInterval(id); };
            }, [cd.status]);

            // Sync LocalStorage
            React.useEffect(() => { saveJSON('tt_players', players); }, [players]);
            React.useEffect(() => { saveJSON('tt_history', history); }, [history]);
            React.useEffect(() => { saveJSON('tt_settings', settings); }, [settings]);
            React.useEffect(() => { saveJSON('tt_presets', presets); }, [presets]);
            React.useEffect(() => { saveJSON('tt_leagues', leagues); }, [leagues]);
            // トーナメント: 結果の入力・修正のあと、勝者を次の回に進め、参加者が変わった対戦の結果をリセットする
            React.useEffect(() => {
                setLeagues(prev => {
                    let changed = false;
                    const next = prev.map(l => {
                        if (l.format !== 'tournament') return l;

                        changed = true;
                        return { ...l, fixtures: fx };
                    });
                    return changed ? next : prev;
                });
            }, [leagues]);
            // 効果音の音量を反映
            React.useEffect(() => {
                const v = typeof settings.soundVolume === 'number' ? settings.soundVolume : 100;
                soundEngine.setVolume(v / 100);
            }, [settings.soundVolume]);

            // Save match to history
            const saveCurrentMatchToHistory = (stateToSave, matchIdToUse) => {
                const isDoubles = settings.matchMode === 'doubles';
                const p1Player = players.find(p => p.id === stateToSave.p1Id);
                const p1Partner = players.find(p => p.id === stateToSave.p1PartnerId);
                const p2Player = players.find(p => p.id === stateToSave.p2Id);
                const p2Partner = players.find(p => p.id === stateToSave.p2PartnerId);

                const p1Name = isDoubles ? `${p1Player?.name || 'P1'} / ${p1Partner?.name || 'P1-2'}` : (p1Player?.name || 'P1');
                const p2Name = isDoubles ? `${p2Player?.name || 'P2'} / ${p2Partner?.name || 'P2-2'}` : (p2Player?.name || 'P2');

                const isHasScore = stateToSave.p1Score > 0 || stateToSave.p2Score > 0 || stateToSave.p1Games > 0 || stateToSave.p2Games > 0 || stateToSave.gameLogs.length > 0;
                
                if (!isHasScore && !stateToSave.isFinished) return matchIdToUse;

                const matchId = matchIdToUse || currentMatchId || Date.now().toString();
                if (!currentMatchId) setCurrentMatchId(matchId);

                const historyItem = {
                    id: matchId,
                    status: stateToSave.isFinished ? 'completed' : 'in_progress',
                    date: new Date().toLocaleDateString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    p1Id: stateToSave.p1Id,
                    p2Id: stateToSave.p2Id,
                    p1PartnerId: stateToSave.p1PartnerId,
                    p2PartnerId: stateToSave.p2PartnerId,
                    p1TimeoutsUsed: stateToSave.p1TimeoutsUsed || 0,
                    p2TimeoutsUsed: stateToSave.p2TimeoutsUsed || 0,
                    p1Ids: isDoubles ? [stateToSave.p1Id, stateToSave.p1PartnerId] : [stateToSave.p1Id],
                    p2Ids: isDoubles ? [stateToSave.p2Id, stateToSave.p2PartnerId] : [stateToSave.p2Id],
                    p1Name,
                    p2Name,
                    p1Score: stateToSave.p1Score,
                    p2Score: stateToSave.p2Score,
                    p1Games: stateToSave.p1Games,
                    p2Games: stateToSave.p2Games,
                    maxGames: stateToSave.maxGames,
                    gameLogs: stateToSave.gameLogs,
                    firstServer: stateToSave.firstServer,
                    swappedCourt: stateToSave.swappedCourt,
                    pointLog: stateToSave.pointLog || [],
                    doublesOrder: stateToSave.doublesOrder || null,
                    doublesPrevOrder: stateToSave.doublesPrevOrder || null,
                    leagueLink: stateToSave.leagueLink || null,
                    leagueName: stateToSave.leagueLink ? ((leagues.find(l => l.id === stateToSave.leagueLink.leagueId) || {}).name || '') : '',
                    matchMode: settings.matchMode,
                    // 完了した試合は取り消し履歴を保存しない (localStorage容量対策)
                    stack: stateToSave.isFinished ? [] : (stateToSave.stack || []),
                    winnerSide: stateToSave.isFinished ? (stateToSave.winnerId === stateToSave.p1Id ? 'p1' : 'p2') : null,
                    winnerName: stateToSave.isFinished ? (stateToSave.winnerId === stateToSave.p1Id ? p1Name : p2Name) : null
                };

                setHistory(prev => {
                    const filtered = prev.filter(h => h.id !== matchId);
                    return [historyItem, ...filtered].slice(0, 200);
                });

                return matchId;
            };

            const addPoint = (player) => {
                if (matchState.isFinished) return;

                const previousState = makeSnapshot(matchState, 'add');

                let newP1Score = matchState.p1Score;
                let newP2Score = matchState.p2Score;

                if (player === 'p1') {
                    newP1Score++;
                    soundEngine.playPing(settings.soundEnabled);
                } else {
                    newP2Score++;
                    soundEngine.playPong(settings.soundEnabled);
                }

                // 1点ごとの記録 [ゲーム番号, 得点者, A点, B点, サーバー]
                const isDoublesMode = settings.matchMode === 'doubles';
                const serverBeforePoint = getCurrentServer(matchState.p1Score, matchState.p2Score, matchState.firstServer, settings.pointsToWin, settings.serveInterval);
                const newPointLog = [
                    ...(matchState.pointLog || []),
                    [matchState.p1Games + matchState.p2Games, player === 'p1' ? 1 : 2, newP1Score, newP2Score, serverBeforePoint === 'p1' ? 1 : 2]
                ];

                // Speech Score Announcement
                // サーブ権を持つ側の点数から先に読み上げる
                const serverAfterPoint = getCurrentServer(
                    newP1Score,
                    newP2Score,
                    matchState.firstServer,
                    settings.pointsToWin,
                    settings.serveInterval
                );
                const serverScoreForSpeech = serverAfterPoint === 'p1' ? newP1Score : newP2Score;
                const receiverScoreForSpeech = serverAfterPoint === 'p1' ? newP2Score : newP1Score;
                speakScore(serverScoreForSpeech, receiverScoreForSpeech, settings.speechEnabled, settings.speechLanguage || 'en', speechOptsFrom(settings));

                const targetPoints = settings.pointsToWin;
                const deuceStart = targetPoints - 1;
                const isDeuce = newP1Score >= deuceStart && newP2Score >= deuceStart;
                let gameWonBy = null;

                if (isDeuce) {
                    if (Math.abs(newP1Score - newP2Score) >= 2) {
                        gameWonBy = newP1Score > newP2Score ? 'p1' : 'p2';
                    }
                } else {
                    if (newP1Score >= targetPoints) gameWonBy = 'p1';
                    if (newP2Score >= targetPoints) gameWonBy = 'p2';
                }

                let newP1Games = matchState.p1Games;
                let newP2Games = matchState.p2Games;
                let newGameLogs = [...matchState.gameLogs];
                let isMatchFinished = false;
                let winner = null;

                if (gameWonBy) {
                    newGameLogs.push({ p1: newP1Score, p2: newP2Score });
                    if (gameWonBy === 'p1') newP1Games++;
                    else newP2Games++;

                    const gamesToWin = Math.ceil(matchState.maxGames / 2);

                    if (newP1Games >= gamesToWin) {
                        isMatchFinished = true;
                        winner = matchState.p1Id;
                    } else if (newP2Games >= gamesToWin) {
                        isMatchFinished = true;
                        winner = matchState.p2Id;
                    }

                    newP1Score = 0;
                    newP2Score = 0;

                    const nextFirstServer = matchState.firstServer === 'p1' ? 'p2' : 'p1';

                    // ダブルス: 次のゲームのサーブ順 (最初のレシーバー側ペアが先にサーブ。初期値は前ゲームの最初のレシーバー)
                    let nextDoublesOrder = matchState.doublesOrder;
                    let nextDoublesPrev = matchState.doublesPrevOrder;
                    if (isDoublesMode && matchState.doublesOrder && !isMatchFinished) {
                        nextDoublesPrev = matchState.doublesOrder;
                        nextDoublesOrder = nextGameDoublesOrder(matchState.doublesOrder, matchState.doublesOrder[1]);
                    }

                    if (!isMatchFinished && (settings.autoCourtChange || isDoublesMode)) {
                        const nm = (id) => (players.find(pl => pl.id === id) || {}).name || '';
                        const parts = [];
                        if (settings.autoCourtChange) parts.push('コートチェンジ');
                        if (isDoublesMode && nextDoublesOrder) parts.push(`最初のサーバー: ${nm(nextDoublesOrder[0])}`);
                        setToast({ msg: `🔄 ゲーム終了：${parts.join(' / ')}`, id: Date.now() });
                    }

                    if (isMatchFinished) {
                        soundEngine.playWin(settings.soundEnabled);
                    }

                    const updatedState = {
                        ...matchState,
                        p1Score: newP1Score,
                        p2Score: newP2Score,
                        p1Games: newP1Games,
                        p2Games: newP2Games,
                        gameLogs: newGameLogs,
                        firstServer: nextFirstServer,
                        swappedCourt: settings.autoCourtChange ? !matchState.swappedCourt : matchState.swappedCourt,
                        pointLog: newPointLog,
                        doublesOrder: nextDoublesOrder,
                        doublesPrevOrder: nextDoublesPrev,
                        isFinished: isMatchFinished,
                        winnerId: winner,
                        stack: [...matchState.stack, previousState].slice(-60)
                    };

                    setMatchState(updatedState);
                    saveCurrentMatchToHistory(updatedState, currentMatchId);
                } else {
                    // 最終ゲームでどちらかが規定点の半分(11点制なら5点)に先に達したらエンドチェンジ
                    let nextSwapped = matchState.swappedCourt;
                    const gamesToWinNow = Math.ceil(matchState.maxGames / 2);
                    const isDecidingGame = matchState.maxGames >= 3 &&
                        matchState.p1Games === gamesToWinNow - 1 &&
                        matchState.p2Games === gamesToWinNow - 1;
                    const midPoint = Math.floor(targetPoints / 2);
                    const scorerScore = player === 'p1' ? newP1Score : newP2Score;
                    const otherScore = player === 'p1' ? newP2Score : newP1Score;
                    const midTrigger = isDecidingGame && scorerScore === midPoint && otherScore < midPoint;
                    let nextDoublesOrder = matchState.doublesOrder;
                    if (midTrigger && isDoublesMode && nextDoublesOrder) {
                        // 最終ゲームのチェンジエンド: レシーブ側ペアのレシーブ順が入れ替わる
                        const i = getServeSlot(newP1Score, newP2Score, settings.pointsToWin, settings.serveInterval) % 4;
                        const arr = [...nextDoublesOrder];
                        const a = (i + 1) % 4, b = (i + 3) % 4;
                        [arr[a], arr[b]] = [arr[b], arr[a]];
                        nextDoublesOrder = arr;
                    }
                    if (midTrigger && (settings.autoCourtChange || isDoublesMode)) {
                        if (settings.autoCourtChange) nextSwapped = !nextSwapped;
                        const parts = [];
                        if (settings.autoCourtChange) parts.push('コートチェンジ');
                        if (isDoublesMode) parts.push('レシーブ順が入れ替わります');
                        setToast({ msg: `🔄 最終ゲーム：${parts.join(' / ')}`, id: Date.now() });
                    }

                    const updatedState = {
                        ...matchState,
                        p1Score: newP1Score,
                        p2Score: newP2Score,
                        pointLog: newPointLog,
                        doublesOrder: nextDoublesOrder,
                        swappedCourt: nextSwapped,
                        stack: [...matchState.stack, previousState].slice(-60)
                    };
                    setMatchState(updatedState);
                    saveCurrentMatchToHistory(updatedState, currentMatchId);
                }
            };

            const subtractPoint = (player, e) => {
                if (e) e.stopPropagation();
                if (matchState.isFinished) return;

                const scoreToSubtract = player === 'p1' ? matchState.p1Score : matchState.p2Score;
                if (scoreToSubtract <= 0) return;

                const previousState = makeSnapshot(matchState, 'subtract');

                // 1点ごとの記録からも、そのプレイヤーの直近の得点を1つ取り除く(現在ゲーム内)
                let newLog = [...(matchState.pointLog || [])];
                const gameNow = matchState.p1Games + matchState.p2Games;
                const wCode = player === 'p1' ? 1 : 2;
                let rm = -1;
                for (let i = newLog.length - 1; i >= 0; i--) {
                    if (newLog[i][0] < gameNow) break;
                    if (newLog[i][0] === gameNow && newLog[i][1] === wCode) { rm = i; break; }
                }
                if (rm >= 0) {
                    newLog.splice(rm, 1);
                    let ra = 0, rb = 0;
                    newLog = newLog.map(en => {
                        if (en[0] !== gameNow) return en;
                        const sv = getCurrentServer(ra, rb, matchState.firstServer, settings.pointsToWin, settings.serveInterval);
                        if (en[1] === 1) ra++; else rb++;
                        return [en[0], en[1], ra, rb, sv === 'p1' ? 1 : 2];
                    });
                }

                const updatedState = {
                    ...matchState,
                    p1Score: player === 'p1' ? matchState.p1Score - 1 : matchState.p1Score,
                    p2Score: player === 'p2' ? matchState.p2Score - 1 : matchState.p2Score,
                    pointLog: newLog,
                    stack: [...matchState.stack, previousState].slice(-60)
                };

                setMatchState(updatedState);
                saveCurrentMatchToHistory(updatedState, currentMatchId);
            };

            const undoPoint = () => {
                if (matchState.stack.length === 0) return;
                const previous = matchState.stack[matchState.stack.length - 1];
                const newStack = matchState.stack.slice(0, -1);
                // リーグ戦の試合で、終了した試合の最後の1点を取り消した場合は、リーグの記録も取り消す
                if (matchState.isFinished && matchState.leagueLink && matchState.leagueRecorded) {
                    const lk = matchState.leagueLink;
                    clearLeagueResult(lk.leagueId, lk.fixtureId, lk.boutIdx);
                }
                const { plen, plogFull, ...prevRest } = previous;
                const curLog = matchState.pointLog || [];
                const restoredLog = plogFull ? plogFull : (typeof plen === 'number' ? curLog.slice(0, plen) : curLog);
                const restoredState = {
                    ...prevRest,
                    pointLog: restoredLog,
                    // 1打戻してもタイムアウトの消費は元に戻さない
                    p1TimeoutsUsed: matchState.p1TimeoutsUsed || 0,
                    p2TimeoutsUsed: matchState.p2TimeoutsUsed || 0,
                    // リーグ戦の結果は、取り消した場合は再度の試合終了時に記録し直す
                    leagueRecorded: false,
                    stack: newStack
                };
                setMatchState(restoredState);
                saveCurrentMatchToHistory(restoredState, currentMatchId);
            };

            const resumeMatch = (item) => {
                setMatchState({
                    p1Id: item.p1Id || '1',
                    p1PartnerId: item.p1PartnerId || '3',
                    p2Id: item.p2Id || '2',
                    p2PartnerId: item.p2PartnerId || '4',
                    maxGames: item.maxGames || 3,
                    p1Score: item.p1Score || 0,
                    p2Score: item.p2Score || 0,
                    p1Games: item.p1Games || 0,
                    p2Games: item.p2Games || 0,
                    gameLogs: item.gameLogs || [],
                    firstServer: item.firstServer || 'p1',
                    swappedCourt: item.swappedCourt || false,
                    pointLog: item.pointLog || [],
                    doublesOrder: item.doublesOrder || (item.matchMode === 'doubles'
                        ? setupDoublesOrder({ firstServer: item.firstServer || 'p1', p1Id: item.p1Id || '1', p1PartnerId: item.p1PartnerId || '3', p2Id: item.p2Id || '2', p2PartnerId: item.p2PartnerId || '4' })
                        : null),
                    doublesPrevOrder: item.doublesPrevOrder || null,
                    doublesFirstServerId: '',
                    doublesFirstReceiverId: '',
                    leagueLink: item.leagueLink || null,
                    leagueRecorded: item.status === 'completed',
                    p1TimeoutsUsed: item.p1TimeoutsUsed || 0,
                    p2TimeoutsUsed: item.p2TimeoutsUsed || 0,
                    isFinished: item.status === 'completed',
                    isPaused: false,
                    winnerId: item.winnerSide
                        ? (item.winnerSide === 'p1' ? (item.p1Id || '1') : (item.p2Id || '2'))
                        : (item.winnerName ? (item.winnerName === item.p1Name ? (item.p1Id || '1') : (item.p2Id || '2')) : null),
                    stack: item.stack || []
                });
                if (item.matchMode) {
                    setSettings(prev => ({ ...prev, matchMode: item.matchMode }));
                }
                setCurrentMatchId(item.id);
                setActiveTab('match');
            };

            const startNewMatch = () => {
                const newMatchId = Date.now().toString();
                setCurrentMatchId(newMatchId);
                setMatchState({
                    p1Id: matchState.p1Id,
                    p1PartnerId: matchState.p1PartnerId,
                    p2Id: matchState.p2Id,
                    p2PartnerId: matchState.p2PartnerId,
                    maxGames: matchState.maxGames,
                    p1Score: 0,
                    p2Score: 0,
                    p1Games: 0,
                    p2Games: 0,
                    gameLogs: [],
                    p1TimeoutsUsed: 0,
                    p2TimeoutsUsed: 0,
                    firstServer: matchState.firstServer,
                    swappedCourt: false,
                    isFinished: false,
                    isPaused: false,
                    winnerId: null,
                    pointLog: [],
                    doublesOrder: settings.matchMode === 'doubles' ? setupDoublesOrder(matchState) : null,
                    doublesPrevOrder: null,
                    doublesFirstServerId: matchState.doublesFirstServerId || '',
                    doublesFirstReceiverId: matchState.doublesFirstReceiverId || '',
                    leagueLink: null,
                    leagueRecorded: false,
                    stack: []
                });
                setActiveTab('match');
            };

            // ---- タイムアウト (ITTF: 1人/1ペアにつき1試合1回・最大1分。準備できれば早く再開可) ----
            const timeoutsLeft = (side) => Math.max(0, (settings.timeoutsPerSide || 0) - (matchState[side + 'TimeoutsUsed'] || 0));

            // side: 'p1' | 'p2' | 'both'(同時請求: 双方が1回ずつ消費)
            const startTimeout = (side) => {
                const sides = side === 'both' ? ['p1', 'p2'] : [side];
                if (matchState.isFinished || sides.some(sd => timeoutsLeft(sd) <= 0)) return;
                const updated = { ...matchState };
                sides.forEach(sd => { updated[sd + 'TimeoutsUsed'] = (matchState[sd + 'TimeoutsUsed'] || 0) + 1; });
                setMatchState(updated);
                saveCurrentMatchToHistory(updated, currentMatchId);

                const total = Math.max(1, settings.timeoutSeconds || 60);
                setTimerTime(total);
                setTimeoutInfo({ side, endsAt: Date.now() + total * 1000, totalSec: total });
                setTimeoutPickerOpen(false);
            };

            const endTimeout = () => setTimeoutInfo(null);

            // 誤操作で開始してしまった場合: 回数を戻して閉じる
            const cancelTimeout = () => {
                if (!timeoutInfo) return;
                const sides = timeoutInfo.side === 'both' ? ['p1', 'p2'] : [timeoutInfo.side];
                const updated = { ...matchState };
                sides.forEach(sd => { updated[sd + 'TimeoutsUsed'] = Math.max(0, (matchState[sd + 'TimeoutsUsed'] || 0) - 1); });
                setMatchState(updated);
                saveCurrentMatchToHistory(updated, currentMatchId);
                setTimeoutInfo(null);
            };

            const countdownTotalSec = Math.max(1, settings.countdownSeconds || 60);
            const cdToggle = () => {
                setCd(prev => {
                    if (prev.status === 'running') {
                        return { status: 'paused', endsAt: 0, remainingMs: Math.max(0, prev.endsAt - Date.now()) };
                    }
                    if (prev.status === 'paused') {
                        return { status: 'running', endsAt: Date.now() + prev.remainingMs, remainingMs: prev.remainingMs };
                    }
                    const total = countdownTotalSec * 1000;   // idle / finished は最初から
                    return { status: 'running', endsAt: Date.now() + total, remainingMs: total };
                });
            };
            const cdReset = () => setCd({ status: 'idle', endsAt: 0, remainingMs: 0 });

            const stopAlarm = () => {
                const wasReal = alarmRinging === 'real';
                setAlarmRinging(null);
                if (!wasReal) return;   // テスト鳴動は設定を変えない
                if (settings.alarmRepeat) {
                    setAlarmNextAt(computeNextAlarm(settings.alarmTime));
                } else {
                    setSettings(prev => ({ ...prev, alarmEnabled: false }));   // 1回きりのアラームは止めたら解除
                }
            };

            const snoozeAlarm = () => {
                const next = Date.now() + 5 * 60000;
                preNoticeRef.current = next;     // スヌーズ直後に予告が出ないように
                setAlarmRinging(null);
                setAlarmNextAt(next);
            };

            // 設定画面の「試し聞き」(オン/オフの設定に関係なく鳴らす)
            const testEffectSound = () => {
                soundEngine.playPing(true);
                setTimeout(() => soundEngine.playPong(true), 260);
            };
            const testSpeech = (sv, rv) => speakScore(sv, rv, true, settings.speechLanguage || 'en', speechOptsFrom(settings));

            const openSettingsSection = (key) => {
                setSettingsSection(key);
                try { window.scrollTo(0, 0); } catch (e) {}
            };

            // ダブルスのサーブ順を変更 (0-0のときだけ)
            const openDoublesModal = () => {
                const o = matchState.doublesOrder;
                if (!o) return;
                setDoublesPick({ server: o[0], receiver: o[1] });
                setDoublesModalOpen(true);
            };
            const applyDoublesOrderChoice = (serverId, receiverId) => {
                const ms = matchState;
                const firstPair = ms.firstServer === 'p1' ? [ms.p1Id, ms.p1PartnerId] : [ms.p2Id, ms.p2PartnerId];
                const otherPair = ms.firstServer === 'p1' ? [ms.p2Id, ms.p2PartnerId] : [ms.p1Id, ms.p1PartnerId];
                const order = ms.doublesPrevOrder
                    ? nextGameDoublesOrder(ms.doublesPrevOrder, serverId)
                    : buildDoublesOrder(firstPair, otherPair, serverId, receiverId);
                const updated = { ...ms, doublesOrder: order };
                setMatchState(updated);
                saveCurrentMatchToHistory(updated, currentMatchId);
                setDoublesModalOpen(false);
            };

            // ---- リーグ戦・団体戦 ----
            const entName = (lg, id) => (lg.entrants.find(e => e.id === id) || {}).name || '?';
            const entMembers = (lg, id) => (lg.entrants.find(e => e.id === id) || {}).memberIds || [];

            const recordLeagueResult = (leagueId, fixtureId, boutIdx, result) => {
                setLeagues(prev => prev.map(l => {
                    if (l.id !== leagueId) return l;
                    return {
                        ...l,
                        fixtures: l.fixtures.map(f => {
                            if (f.id !== fixtureId) return f;
                            if (boutIdx === null || boutIdx === undefined) {
                                return { ...f, status: 'done', aGames: result.aGames, bGames: result.bGames, games: result.games || [], matchId: result.matchId || null };
                            }
                            return {
                                ...f,
                                bouts: f.bouts.map((b, i) => i !== boutIdx ? b : {
                                    ...b, done: true, winner: result.aGames > result.bGames ? 'a' : 'b',
                                    aGames: result.aGames, bGames: result.bGames, games: result.games || [],
                                    aIds: result.aIds || b.aIds, bIds: result.bIds || b.bIds, matchId: result.matchId || null
                                })
                            };
                        })
                    };
                }));
            };
            const clearLeagueResult = (leagueId, fixtureId, boutIdx) => {
                setLeagues(prev => prev.map(l => {
                    if (l.id !== leagueId) return l;
                    return {
                        ...l,
                        fixtures: l.fixtures.map(f => {
                            if (f.id !== fixtureId) return f;
                            if (boutIdx === null || boutIdx === undefined) return { ...f, status: 'pending', aGames: 0, bGames: 0, games: [], matchId: null };
                            return { ...f, bouts: f.bouts.map((b, i) => i !== boutIdx ? b : { ...b, done: false, winner: null, aGames: 0, bGames: 0, games: [], matchId: null }) };
                        })
                    };
                }));
            };

            const rulesForPreset = (presetId) => {
                if (presetId === 'current') return currentRules();
                const pr = [...BUILTIN_PRESETS, ...presets].find(x => x.id === presetId);
                return pr ? { ...pr.rules } : currentRules();
            };

            const openLeagueForm = () => {
                setLeagueForm({ name: '', format: 'roundrobin', type: 'singles', presetId: 'current', winPts: 2, lossPts: 1, boutPresetId: 's5', entrants: [], singlesSel: [], pairA: '', pairB: '', teamName: '', teamSel: [], seedMap: {}, drawSeed: Math.floor(Math.random() * 2147483646) + 1, thirdPlace: false });
                setLeagueView('new');
            };
            // シード番号の指定 (同じ番号を別の人に付けたら入れ替え)
            const setFormSeed = (entId, value) => setLeagueForm(prev => {
                const map = { ...prev.seedMap };
                const n = value === '' ? 0 : Number(value);
                const old = map[entId] || 0;
                if (!n) {
                    delete map[entId];
                } else {
                    const other = Object.keys(map).find(k => k !== entId && map[k] === n);
                    if (other) { if (old) map[other] = old; else delete map[other]; }
                    map[entId] = n;
                }
                return { ...prev, seedMap: map };
            });
            const redrawTournament = (lg) => {
                const seed = Math.floor(Math.random() * 2147483646) + 1;
                setLeagues(prev => prev.map(l => (l.id !== lg.id ? l : { ...l, drawSeed: seed, fixtures: buildTournamentFixtures({ ...l, drawSeed: seed }) })));
                setSelectedFixture(null);
                setExpandedFixture(null);
                setToast({ msg: '🎲 組み合わせを抽選し直しました', id: Date.now() });
            };
            const updForm = (patch) => setLeagueForm(prev => ({ ...prev, ...patch }));
            const toggleFormSel = (key, id) => setLeagueForm(prev => ({ ...prev, [key]: prev[key].includes(id) ? prev[key].filter(x => x !== id) : [...prev[key], id] }));
            const addPairEntrant = () => {
                const f = leagueForm;
                if (!f.pairA || !f.pairB || f.pairA === f.pairB) return;
                const key = [f.pairA, f.pairB].sort().join('+');
                if (f.entrants.some(e => e.key === key)) return;
                updForm({
                    entrants: [...f.entrants, { id: 'e' + Date.now(), key, name: `${playerName(f.pairA)} / ${playerName(f.pairB)}`, memberIds: [f.pairA, f.pairB] }],
                    pairA: '', pairB: ''
                });
            };
            const addTeamEntrant = () => {
                const f = leagueForm;
                if (f.teamSel.length < 2) return;
                const name = f.teamName.trim() || `チーム${f.entrants.length + 1}`;
                updForm({ entrants: [...f.entrants, { id: 'e' + Date.now(), name, memberIds: [...f.teamSel] }], teamName: '', teamSel: [] });
            };
            const formEntrants = (f) => f.type === 'singles'
                ? f.singlesSel.map(id => ({ id: 'e_' + id, name: playerName(id), memberIds: [id] }))
                : f.entrants;
            const createLeague = () => {
                const f = leagueForm;
                const ents = formEntrants(f);
                if (ents.length < 2) return;
                const bp = BOUT_PRESETS.find(b => b.id === f.boutPresetId) || BOUT_PRESETS[0];
                const lg = {
                    id: 'lg' + Date.now(),
                    name: f.name.trim() || `${f.format === 'tournament' ? 'トーナメント' : 'リーグ戦'} ${new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' })}`,
                    type: f.type, createdAt: Date.now(), winPts: f.winPts, lossPts: f.lossPts,
                    rules: rulesForPreset(f.presetId),
                    boutKinds: f.type === 'team' ? bp.kinds : [],
                    entrants: ents, fixtures: []
                };
                if (f.format === 'tournament') {
                    lg.format = 'tournament';
                    lg.thirdPlace = !!f.thirdPlace && ents.length >= 4;
                    lg.seedMap = { ...f.seedMap };
                    lg.drawSeed = f.drawSeed;
                    lg.winPts = 0; lg.lossPts = 0;
                    lg.fixtures = buildTournamentFixtures(lg);
                } else {
                    lg.fixtures = buildFixtures(lg);
                }
                setLeagues(prev => [lg, ...prev]);
