    <style>
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; /* ダブルタップ遅延・ズーム防止 */
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        /* Dark Theme Glassmorphism */
        .theme-dark {
            background-color: #000000;
            color: #f5f5f7;
        }
        .theme-dark .glass-card {
            background: rgba(28, 28, 30, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .theme-dark .glass-nav {
            background: rgba(20, 20, 22, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .theme-dark .input-field {
            background-color: #2c2c2e;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Light Theme Glassmorphism */
        .theme-light {
            background-color: #f2f2f7;
            color: #1d1d1f;
        }
        .theme-light .glass-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 8px 24px 0 rgba(0, 0, 0, 0.06);
        }
        .theme-light .glass-nav {
            background: rgba(245, 245, 247, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }
        .theme-light .input-field {
            background-color: #e5e5ea;
            color: #000000;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        /* Pulse animation for active server */
        @keyframes servePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.85; }
        }
        .serve-active {
            animation: servePulse 1.8s infinite ease-in-out;
        }

        /* Pulse animation for match/game point badges */
        @keyframes alertGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 159, 10, 0.5); }
            50% { box-shadow: 0 0 20px rgba(255, 159, 10, 0.9); }
        }
        .badge-alert {
            animation: alertGlow 1.5s infinite ease-in-out;
        }

        /* animate-fade-in はTailwindに無いため定義 */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.25s ease-out; }

        /* 長押し加点・ロック解除の進み具合表示 (animation-duration はインラインで指定) */
        @keyframes pressFill { from { width: 0%; } to { width: 100%; } }
        .press-fill { animation-name: pressFill; animation-timing-function: linear; animation-fill-mode: forwards; }
        .no-callout { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
